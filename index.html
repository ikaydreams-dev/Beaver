<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ─────────────────────────────────────────── -->
    <title>Beaver Technologies — We Build What Matters</title>
    <meta name="description" content="Beaver Technologies is the parent company behind STEPsBuild and SlimFile — purposeful software built to solve real problems for organisations and individuals across the globe." />
    <meta name="keywords" content="Beaver Technologies, STEPsBuild, SlimFile, software company, project management software, file compression, file conversion, software development" />
    <meta name="author" content="Beaver Technologies" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://beaver-llc.com" />

    <!-- ── Favicon ─────────────────────────────────────────────── -->
    <link rel="icon" href="/new-logo-1.png" type="image/png" />
    <link rel="icon" href="/new-logo-1.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/new-logo-1.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/new-logo-1.png" />

    <!-- ── Open Graph (Google, Facebook, LinkedIn) ─────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://beaver-llc.com" />
    <meta property="og:site_name"   content="Beaver Technologies" />
    <meta property="og:title"       content="Beaver Technologies — We Build What Matters" />
    <meta property="og:description" content="The parent company behind STEPsBuild and SlimFile — purposeful software built to solve real problems for organisations and individuals across the globe." />
    <meta property="og:image"       content="/new-logo-1.png" />
    <meta property="og:image:width"  content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt"   content="Beaver Technologies logo" />

    <!-- ── Twitter / X Card ────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Beaver Technologies — We Build What Matters" />
    <meta name="twitter:description" content="The parent company behind STEPsBuild and SlimFile — purposeful software built to solve real problems worldwide." />
    <meta name="twitter:image"       content="/new-logo-1.png" />

    <!-- ── Structured Data — Organisation (Google Rich Results) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Beaver Technologies",
      "description": "Beaver Technologies is the parent company behind STEPsBuild and SlimFile — purposeful software built to solve real problems for organisations and individuals across the globe.",
      "url": "https://beaver-llc.com",
      "logo": "https://beaver-llc.com/new-logo-1.png",
      "sameAs": [
        "https://stepsbuild.com",
        "https://www.slim-file.com"
      ],
      "subOrganization": [
        {
          "@type": "Organization",
          "name": "STEPsBuild",
          "url": "https://stepsbuild.com",
          "description": "Structured project management platform guiding organisations from readiness to regenerative impact."
        },
        {
          "@type": "Organization",
          "name": "SlimFile",
          "url": "https://www.slim-file.com",
          "description": "Intelligent file compression, conversion, and collaboration platform."
        }
      ]
    }
    </script>

    <!-- ── Structured Data — WebSite (enables Google Sitelinks searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Beaver Technologies",
      "url": "https://beaver-llc.com"
    }
    </script>

    <!-- ── Fonts ────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
