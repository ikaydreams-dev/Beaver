<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ─────────────────────────────────────────── -->
    <title>Beaver Technologies — We Build What Matters | Enterprise Software Solutions</title>
    <meta name="description" content="Beaver Technologies builds purposeful software for companies, institutions, and governments. 14+ enterprise products including STEPsBuild, SlimFile, LogBook, and more. Contact: admin@beaver-llc.com" />
    <meta name="keywords" content="Beaver Technologies, enterprise software, business software solutions, STEPsBuild, SlimFile, project management, document management, pharmacy software, government software, institutional software, SaaS solutions, custom software development" />
    <meta name="author" content="Beaver Technologies" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <link rel="canonical" href="https://beaver-llc.com" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- ── Additional SEO ──────────────────────────────────────── -->
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="geo.region" content="US" />
    <meta name="geo.placename" content="Global" />
    <meta name="language" content="English" />
    <meta name="rating" content="General" />

    <!-- ── Favicon ─────────────────────────────────────────────── -->
    <link rel="icon" href="/new-logo-1.png" type="image/png" />
    <link rel="icon" href="/new-logo-1.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/new-logo-1.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/new-logo-1.png" />

    <!-- ── Open Graph (Google, Facebook, LinkedIn) ─────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://beaver-llc.com" />
    <meta property="og:site_name"   content="Beaver Technologies" />
    <meta property="og:title"       content="Beaver Technologies — We Build What Matters | Enterprise Software Solutions" />
    <meta property="og:description" content="Beaver Technologies builds purposeful software for companies, institutions, and governments. 14+ enterprise products serving organizations globally." />
    <meta property="og:image"       content="https://beaver-llc.com/new-logo-1.png" />
    <meta property="og:image:secure_url" content="https://beaver-llc.com/new-logo-1.png" />
    <meta property="og:image:width"  content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt"   content="Beaver Technologies logo" />
    <meta property="og:image:type"  content="image/png" />
    <meta property="og:locale"      content="en_US" />

    <!-- ── Twitter / X Card ────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@BeaverTech" />
    <meta name="twitter:title"       content="Beaver Technologies — We Build What Matters" />
    <meta name="twitter:description" content="Beaver Technologies builds purposeful software for companies, institutions, and governments. 14+ enterprise products serving organizations globally." />
    <meta name="twitter:image"       content="https://beaver-llc.com/new-logo-1.png" />
    <meta name="twitter:image:alt"   content="Beaver Technologies logo" />

    <!-- ── Structured Data — Organisation (Google Rich Results) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Beaver Technologies",
      "alternateName": "Beaver LLC",
      "description": "Beaver Technologies builds purposeful software that solves real problems for companies, institutions, and governments across the globe. We specialize in enterprise software solutions, project management, document management, and custom SaaS platforms.",
      "url": "https://beaver-llc.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://beaver-llc.com/new-logo-1.png",
        "width": 512,
        "height": 512
      },
      "email": "admin@beaver-llc.com",
      "foundingDate": "2020",
      "numberOfEmployees": {
        "@type": "QuantitativeValue",
        "value": "10-50"
      },
      "knowsAbout": [
        "Software Development",
        "Enterprise Software",
        "SaaS Solutions",
        "Project Management Software",
        "Document Management",
        "Business Process Automation"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "admin@beaver-llc.com",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://stepsbuild.com",
        "https://www.slim-file.com",
        "https://logbook.stepsbuild.com",
        "https://mall.beaver-llc.com"
      ],
      "makesOffer": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "SoftwareApplication",
            "name": "STEPsBuild",
            "applicationCategory": "Project Management Software",
            "description": "Project management reimagined"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "SoftwareApplication",
            "name": "SlimFile",
            "applicationCategory": "Document Management Software",
            "description": "Compress, convert & collaborate"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "SoftwareApplication",
            "name": "LogBook",
            "applicationCategory": "Business Software",
            "description": "Track and document everything"
          }
        }
      ]
    }
    </script>

    <!-- ── Structured Data — WebSite (enables Google Sitelinks searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Beaver Technologies",
      "url": "https://beaver-llc.com"
    }
    </script>

    <!-- ── Performance Optimization ─────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload critical assets -->
    <link rel="preload" href="/new-logo-1.png" as="image" type="image/png" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" as="style" />

    <!-- ── Fonts (optimized loading) ─────────────────────────────── -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
